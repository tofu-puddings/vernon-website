<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vernon Arcade</title>
    <style>
        /* ──────────────── IMPORTS ──────────────── */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

        /* ──────────────── BASE ──────────────── */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'VT323', monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        /* CRT Scanline overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 9999;
        }

        /* ──────────────── FLIP PHONE INTRO ──────────────── */
        #introScreen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1a0b2e, #0a0a0f);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #introScreen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .flip-phone {
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            border-radius: 40px 40px 20px 20px;
            padding: 20px 20px 30px;
            width: 320px;
            box-shadow: 0 0 60px rgba(255, 0, 204, 0.3), inset 0 -4px 8px rgba(0,0,0,0.8);
            border: 2px solid #ff00cc;
            transform: rotate(-2deg);
            transition: transform 0.3s;
        }
        .flip-phone:hover { transform: rotate(0deg) scale(1.02); }

        .phone-hinge {
            width: 60px;
            height: 6px;
            background: #2a2a3a;
            margin: 0 auto 10px;
            border-radius: 10px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
        .phone-screen {
            background: #0f0f1a;
            border-radius: 24px;
            padding: 24px 18px 18px;
            border: 2px solid #ff00cc;
            box-shadow: inset 0 0 20px rgba(255, 0, 204, 0.1);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
        }
        .phone-screen .call-icon { font-size: 2.5rem; margin-bottom: 0.25rem; animation: pulse 1.5s infinite; }
        .phone-screen .caller-id {
            font-size: 1.2rem;
            color: #ff00cc;
            text-shadow: 0 0 20px #ff00cc;
            letter-spacing: 4px;
        }
        .phone-screen .question {
            font-size: 1rem;
            color: #00f3ff;
            margin-top: 0.5rem;
            text-shadow: 0 0 20px #00f3ff;
            line-height: 1.6;
        }
        .phone-screen .sub-text { font-size: 0.7rem; color: #8888aa; margin-top: 0.5rem; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .phone-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
            padding: 0 8px;
        }
        .phone-key {
            background: #2a2a3a;
            border: none;
            color: #aaa;
            padding: 10px 0;
            border-radius: 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            box-shadow: inset 0 -3px 0 #0a0a0f, 0 2px 4px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: 0.1s;
        }
        .phone-key:active { transform: scale(0.95); }
        .phone-key.call-btn {
            background: #ff00cc;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.4);
            grid-column: span 1;
        }
        .phone-key.call-btn:hover { background: #ff44dd; }

        /* ──────────────── ARCADE LAYOUT ──────────────── */
        #mainApp {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            background: #0a0a0f;
            position: relative;
        }
        #mainApp.active { display: flex; }

        /* ── Top Bar ── */
        .top-bar {
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 3px solid #ff00cc;
            box-shadow: 0 4px 30px rgba(255, 0, 204, 0.2);
            padding: 12px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-bar h1 {
            font-family: 'Press Start 2P', monospace;
            color: #ffd700;
            text-shadow: 0 0 30px #ffd700, 0 0 60px #ff00cc;
            font-size: 1.2rem;
            letter-spacing: 4px;
        }
        .top-bar p {
            font-family: 'VT323', monospace;
            color: #00f3ff;
            font-size: 1rem;
            text-shadow: 0 0 20px #00f3ff;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        /* ── Main Arcade Container ── */
        .arcade-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            gap: 1.5rem;
        }

        /* ── Arcade Machine (Center + Joystick + Side panel) ── */
        .arcade-machine {
            display: grid;
            grid-template-columns: 120px 1fr 240px;
            gap: 1.5rem;
            flex: 1;
        }
        @media (max-width: 900px) {
            .arcade-machine {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
                gap: 1rem;
            }
        }

        /* ── Left: Joystick Panel ── */
        .joystick-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(20, 10, 40, 0.7);
            border-radius: 2rem;
            border: 2px solid #ff00cc;
            box-shadow: inset 0 0 40px rgba(255, 0, 204, 0.05), 0 0 30px rgba(255, 0, 204, 0.1);
            padding: 1rem 0.5rem;
        }
        .joystick-panel .label {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            color: #ffd700;
            margin-bottom: 0.75rem;
            letter-spacing: 2px;
        }
        .joystick-base {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a3a, #0a0a0f);
            border: 3px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            margin-bottom: 1rem;
        }
        .joystick-stick {
            width: 32px;
            height: 32px;
            background: radial-gradient(circle at 40% 40%, #ff00cc, #990066);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.4);
            border: 2px solid #ffd700;
            cursor: grab;
        }
        .joystick-stick:active { cursor: grabbing; }

        .dpad {
            display: grid;
            grid-template-columns: 30px 30px 30px;
            grid-template-rows: 30px 30px 30px;
            gap: 3px;
            margin-bottom: 0.5rem;
        }
        .dpad-btn {
            background: #1a1a2a;
            border: 2px solid #ff00cc;
            border-radius: 4px;
            color: #00f3ff;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            box-shadow: 0 0 10px rgba(255, 0, 204, 0.1);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
        }
        .dpad-btn:hover { background: #2a2a4a; border-color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        .dpad-btn:active { transform: scale(0.92); }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-center {
            grid-column: 2; grid-row: 2;
            background: #ff00cc;
            border-color: #ffd700;
            color: #fff;
            font-weight: bold;
            font-size: 0.4rem;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.3);
        }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }

        .select-btn {
            background: #ff00cc;
            border: 2px solid #ffd700;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.3);
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.25rem;
            letter-spacing: 2px;
        }
        .select-btn:hover { box-shadow: 0 0 50px rgba(255, 0, 204, 0.6); transform: scale(1.05); }

        /* ── Center: Arcade Screen ── */
        .arcade-screen {
            background: #0a0a0f;
            border-radius: 2rem;
            border: 4px solid #ffd700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.15), inset 0 0 60px rgba(255, 215, 0, 0.03);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(2px);
        }
        .arcade-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }
        .arcade-screen .screen-content {
            position: relative;
            z-index: 2;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .screen-content::-webkit-scrollbar { width: 6px; }
        .screen-content::-webkit-scrollbar-track { background: transparent; }
        .screen-content::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }

        /* ── Screen Content Styles ── */
        .screen-content .project-title {
            font-family: 'Press Start 2P', monospace;
            color: #ffd700;
            text-shadow: 0 0 30px #ffd700;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-align: center;
        }
        .screen-content .project-description {
            font-family: 'VT323', monospace;
            color: #e0e0e0;
            font-size: 1.2rem;
            line-height: 1.8;
            text-align: center;
            max-width: 80%;
            margin: 0 auto;
        }
        .screen-content .project-description .highlight {
            color: #ff00cc;
            text-shadow: 0 0 20px #ff00cc;
        }
        .screen-content .project-description .gold {
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
        }
        /* Profile list */
        .profile-list { list-style: none; padding: 0; }
        .profile-list li {
            padding: 0.4rem 0;
            border-bottom: 1px solid #1a1a2a;
            font-family: 'VT323', monospace;
            font-size: 1.1rem;
            color: #ccc;
            display: flex;
            gap: 0.5rem;
        }
        .profile-list li::before { content: "✦"; color: #ff00cc; }
        /* Disco grid */
        .disco-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.75rem;
        }
        .disco-card {
            background: rgba(0,0,0,0.5);
            border-radius: 1rem;
            padding: 0.75rem;
            text-align: center;
            border: 1px solid #ff00cc;
            transition: 0.2s;
        }
        .disco-card:hover { border-color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
        .disco-card .icon { font-size: 2rem; margin-bottom: 0.25rem; }
        .disco-card .title { font-family: 'VT323', monospace; color: #fff; font-size: 0.9rem; }
        .disco-card .year { color: #888; font-size: 0.7rem; }
        /* Album timeline */
        .album-era {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            align-items: center;
        }
        .album-era .era-label {
            font-family: 'Press Start 2P', monospace;
            color: #ff00cc;
            font-size: 0.6rem;
            min-width: 60px;
        }
        .album-era .pics {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .album-era .pics .placeholder-pic {
            width: 60px;
            height: 60px;
            background: #1a0b2e;
            border: 1px solid #ffd700;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #ffd700;
            transition: 0.2s;
        }
        .album-era .pics .placeholder-pic:hover { border-color: #ff00cc; transform: scale(1.05); }
        /* Random box */
        .random-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
            padding: 2rem;
            text-align: center;
            border: 2px dashed #ff00cc;
        }
        .random-box .quote {
            font-size: 1.6rem;
            color: #ffd700;
            font-family: 'VT323', monospace;
            margin: 1rem 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .random-box .btn-spin {
            background: #ff00cc;
            border: 2px solid #ffd700;
            color: #fff;
            padding: 0.5rem 1.5rem;
            border-radius: 40px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.3);
            letter-spacing: 2px;
        }
        .random-box .btn-spin:hover { box-shadow: 0 0 60px rgba(255, 0, 204, 0.6); transform: scale(1.05); }

        /* ── Right: Fan Messages ── */
        .side-panel {
            background: rgba(20, 10, 40, 0.7);
            border-radius: 2rem;
            border: 2px solid #ff00cc;
            box-shadow: inset 0 0 40px rgba(255, 0, 204, 0.05), 0 0 30px rgba(255, 0, 204, 0.1);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 60vh;
            overflow: hidden;
        }
        .side-panel .placeholder-img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 1.5rem;
            background: linear-gradient(135deg, #1a0b2e, #0a0a0f);
            border: 2px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }
        .side-panel .msg-title {
            font-family: 'Press Start 2P', monospace;
            color: #ff00cc;
            font-size: 0.6rem;
            text-align: center;
            text-shadow: 0 0 20px #ff00cc;
            border-bottom: 2px solid #ff00cc;
            padding-bottom: 0.3rem;
            letter-spacing: 2px;
        }
        .side-panel .msg-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            max-height: 150px;
            padding-right: 0.25rem;
        }
        .msg-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 0.4rem 0.6rem;
            border-radius: 0.5rem;
            border-left: 3px solid #ffd700;
            font-family: 'VT323', monospace;
            font-size: 0.9rem;
            color: #ccc;
        }
        .msg-item .sender { color: #ffd700; font-weight: bold; }
        .side-panel .msg-form input,
        .side-panel .msg-form textarea {
            width: 100%;
            background: #0a0a0f;
            border: 2px solid #ff00cc;
            border-radius: 0.75rem;
            padding: 0.4rem 0.6rem;
            color: #fff;
            font-family: 'VT323', monospace;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            outline: none;
            transition: 0.2s;
        }
        .side-panel .msg-form input:focus,
        .side-panel .msg-form textarea:focus { border-color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
        .side-panel .msg-form input::placeholder,
        .side-panel .msg-form textarea::placeholder { color: #555; }
        .side-panel .msg-form button {
            width: 100%;
            background: #ff00cc;
            color: #fff;
            border: 2px solid #ffd700;
            padding: 0.4rem;
            border-radius: 40px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 2px;
        }
        .side-panel .msg-form button:hover {
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.3);
            transform: scale(1.02);
        }

        /* ── Music Player (always at bottom) ── */
        .music-player-bar {
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(8px);
            border-top: 3px solid #ff00cc;
            box-shadow: 0 -4px 30px rgba(255, 0, 204, 0.2);
            padding: 8px 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }
        .music-player-bar .track-info {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            font-family: 'VT323', monospace;
        }
        .music-player-bar .track-info .title {
            color: #ffd700;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .music-player-bar .track-info .artist { color: #888; font-size: 1rem; }
        .music-player-bar .controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .music-player-bar .controls button {
            background: none;
            border: none;
            color: #00f3ff;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'VT323', monospace;
        }
        .music-player-bar .controls button:hover {
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
        }
        .music-player-bar .controls .play-btn { font-size: 1.8rem; color: #ff00cc; }
        .music-player-bar .controls .play-btn:hover { color: #ffd700; }
        .record-icon {
            display: inline-block;
            animation: spin 2s linear infinite;
            animation-play-state: paused;
            font-size: 1.5rem;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ── Toast ── */
        .toast-container {
            position: fixed; bottom: 6rem; right: 2rem; z-index: 9000;
        }
        .toast {
            background: #1a0b2e;
            border: 2px solid #ffd700;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
        }
        .toast.show { display: flex; }

        /* ── Back to Top ── */
        #backToTop {
            position: fixed; bottom: 6rem; left: 2rem; z-index: 999;
            background: #ff00cc; color: #fff; border: 2px solid #ffd700;
            width: 40px; height: 40px; border-radius: 9999px;
            font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.3);
            opacity: 0; transition: 0.3s;
            font-family: 'VT323', monospace;
        }
        #backToTop.visible { opacity: 1; }
        #backToTop:hover { box-shadow: 0 0 50px rgba(255, 0, 204, 0.5); transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- ===== INTRO SCREEN ===== -->
    <div id="introScreen">
        <div class="flip-phone">
            <div class="phone-hinge"></div>
            <div class="phone-screen">
                <div class="call-icon">📞</div>
                <div class="caller-id">VERNON</div>
                <div class="question">"WILL YOU PLAY<br>WITH VERNON?"</div>
                <div class="sub-text">✦ PRESS CALL ✦</div>
            </div>
            <div class="phone-keypad">
                <button class="phone-key">1</button>
                <button class="phone-key">2</button>
                <button class="phone-key">3</button>
                <button class="phone-key">4</button>
                <button class="phone-key">5</button>
                <button class="phone-key">6</button>
                <button class="phone-key">7</button>
                <button class="phone-key">8</button>
                <button class="phone-key">9</button>
                <button class="phone-key">*</button>
                <button class="phone-key call-btn" id="callBtn">CALL</button>
                <button class="phone-key">#</button>
            </div>
        </div>
    </div>

    <!-- ===== MAIN ARCADE APP ===== -->
    <div id="mainApp">
        <!-- Top Bar -->
        <div class="top-bar">
            <h1>✦ VERNON ARCADE ✦</h1>
            <p>▶ PRESS SELECT TO EXPLORE ◀</p>
        </div>

        <!-- Arcade Container -->
        <div class="arcade-container">
            <div class="arcade-machine">
                <!-- Left: Joystick -->
                <div class="joystick-panel">
                    <div class="label">▶ CTRL</div>
                    <div class="joystick-base">
                        <div class="joystick-stick"></div>
                    </div>
                    <div class="dpad">
                        <button class="dpad-btn dpad-up" id="upBtn">▲</button>
                        <button class="dpad-btn dpad-left" id="leftBtn">◀</button>
                        <button class="dpad-btn dpad-center" id="selectBtn">SEL</button>
                        <button class="dpad-btn dpad-right" id="rightBtn">▶</button>
                        <button class="dpad-btn dpad-down" id="downBtn">▼</button>
                    </div>
                    <button class="select-btn" id="bigSelectBtn">⚡ SELECT ⚡</button>
                </div>

                <!-- Center: Arcade Screen -->
                <div class="arcade-screen" id="arcadeScreen">
                    <div class="screen-content" id="screenContent">
                        <!-- Content will be injected by JavaScript -->
                    </div>
                </div>

                <!-- Right: Fan Messages -->
                <div class="side-panel">
                    <div class="placeholder-img" id="sideThumb">💿</div>
                    <div class="msg-title">✧ FAN MESSAGES ✧</div>
                    <div class="msg-list" id="msgList">
                        <div class="msg-item"><span class="sender">CARAT</span> "Vernon is so talented!"</div>
                        <div class="msg-item"><span class="sender">HANSOLFAN</span> "Love his vibe and music."</div>
                    </div>
                    <form class="msg-form" id="msgForm">
                        <input type="text" id="msgName" placeholder="YOUR NAME..." maxlength="20" required />
                        <textarea id="msgContent" placeholder="YOUR MESSAGE..." rows="2" maxlength="200" required></textarea>
                        <button type="submit">SEND MESSAGE</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Music Player (always at bottom) -->
        <div class="music-player-bar">
            <div class="track-info">
                <span class="record-icon" id="recordIcon">💿</span>
                <span class="title" id="trackTitle">Black Eye</span>
                <span class="artist" id="trackArtist">/ Vernon</span>
            </div>
            <div class="controls">
                <button onclick="prevTrack()">⏮</button>
                <button onclick="togglePlay()" id="playBtn" class="play-btn">▶</button>
                <button onclick="nextTrack()">⏭</button>
            </div>
            <audio id="audioPlayer"></audio>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container">
        <div class="toast" id="toast">
            <span>✅</span>
            <span id="toastMsg">Done!</span>
        </div>
    </div>

    <!-- ===== BACK TO TOP ===== -->
    <button id="backToTop">↑</button>

    <script>
        // ── INTRO ──
        document.getElementById('callBtn').addEventListener('click', function() {
            document.getElementById('introScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('active');
        });

        // ── MUSIC PLAYER ──
        const playlist = [
            { title: "Black Eye", artist: "/ Vernon", src: "" },
            { title: "Shining Star", artist: "/ Vernon", src: "" }
        ];
        let currentTrackIndex = 0;
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const recordIcon = document.getElementById('recordIcon');

        function loadTrack(index) {
            const track = playlist[index];
            if (track.src) {
                audio.src = track.src;
                trackTitle.textContent = track.title;
                trackArtist.textContent = track.artist;
            }
        }
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
                recordIcon.style.animationPlayState = 'running';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
                recordIcon.style.animationPlayState = 'paused';
            }
        }
        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            if (audio.src) {
                audio.play();
                playBtn.textContent = '⏸';
                recordIcon.style.animationPlayState = 'running';
            }
        }
        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            if (audio.src) {
                audio.play();
                playBtn.textContent = '⏸';
                recordIcon.style.animationPlayState = 'running';
            }
        }
        loadTrack(0);

        // ── TAB DATA (Projects) ──
        const tabs = [
            {
                title: '✦ SINGLE PROJECT ✦',
                content: `
                    <div style="text-align: center; padding: 1rem 0;">
                        <p class="project-description" style="font-size: 1.4rem;">
                            No matter how far we go alone without our outcasters,<br>
                            we will still stand and <span class="highlight">unveritable</span>.
                        </p>
                        <p style="font-family: 'VT323', monospace; color: #888; margin-top: 1rem; font-size: 1rem;">
                            <span class="gold">✦ ENERVATE COMPANY 2024 © ✦</span>
                        </p>
                        <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem;">
                            <span style="background: #1a0b2e; padding: 0.25rem 0.75rem; border-radius: 20px; border: 1px solid #ffd700; font-size: 0.8rem;">🎮 ARCADE</span>
                            <span style="background: #1a0b2e; padding: 0.25rem 0.75rem; border-radius: 20px; border: 1px solid #ff00cc; font-size: 0.8rem;">💿 VERNON</span>
                        </div>
                    </div>
                `
            },
            {
                title: '✦ PROFILE ✦',
                content: `
                    <ul class="profile-list">
                        <li>Born February 18, 1998 in New York City</li>
                        <li>Fluent in English and Korean</li>
                        <li>Member of SEVENTEEN's Hip-Hop Team</li>
                        <li>Has writing credits on many SEVENTEEN songs</li>
                        <li>Known for witty humor and unique fashion</li>
                        <li>His favorite color is black</li>
                        <li>Has a cat named 'Kkamang'</li>
                    </ul>
                `
            },
            {
                title: '🎵 DISCOGRAPHY',
                content: `
                    <div class="disco-grid">
                        <div class="disco-card"><div class="icon">💿</div><div class="title">17 Is Right Here</div><div class="year">2024 · Best</div></div>
                        <div class="disco-card"><div class="icon">💿</div><div class="title">Spill The Feels</div><div class="year">2024 · Mini 12</div></div>
                        <div class="disco-card"><div class="icon">💿</div><div class="title">FML</div><div class="year">2023 · Mini 10</div></div>
                        <div class="disco-card"><div class="icon">💿</div><div class="title">17 Carat</div><div class="year">2015 · Debut</div></div>
                    </div>
                `
            },
            {
                title: '📸 ALBUMS',
                content: `
                    <div>
                        <div class="album-era">
                            <span class="era-label">2024</span>
                            <div class="pics">
                                <div class="placeholder-pic">🔥</div>
                                <div class="placeholder-pic">✨</div>
                                <div class="placeholder-pic">💫</div>
                            </div>
                        </div>
                        <div class="album-era">
                            <span class="era-label">2023</span>
                            <div class="pics">
                                <div class="placeholder-pic">🌊</div>
                                <div class="placeholder-pic">🔥</div>
                            </div>
                        </div>
                        <div class="album-era">
                            <span class="era-label">2015</span>
                            <div class="pics">
                                <div class="placeholder-pic">🌟</div>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                title: '🎰 RANDOM',
                content: `
                    <div class="random-box">
                        <p style="color:#888;font-family:'VT323',monospace;font-size:1rem;">PRESS SELECT TO GET A RANDOM FACT</p>
                        <p class="quote" id="randomQuote">"Time is gold."</p>
                        <button class="btn-spin" id="spinBtn">⟳ SPIN</button>
                    </div>
                `
            }
        ];

        let currentTab = 0;

        function switchTab(index) {
            if (index < 0) index = tabs.length - 1;
            if (index >= tabs.length) index = 0;
            currentTab = index;
            const screen = document.getElementById('screenContent');
            screen.innerHTML = `<div class="project-title">${tabs[index].title}</div>` + tabs[index].content;
            // Update side thumbnail with random emoji (placeholder)
            const emojis = ['💿', '🎤', '🎸', '🌟', '✨', '🔥', '💫', '🎶'];
            document.getElementById('sideThumb').textContent = emojis[Math.floor(Math.random() * emojis.length)];

            // Re-bind spin button if exists
            const spinBtn = document.getElementById('spinBtn');
            if (spinBtn) {
                spinBtn.addEventListener('click', function() {
                    const quotes = [
                        "I want to be a person who gives good influence.",
                        "Life is like a camera – focus on what's important.",
                        "Let's just be happy.",
                        "Dreams do come true.",
                        "I love our CARATs.",
                        "Music is my language.",
                        "Stay true to yourself.",
                        "Every moment is a memory.",
                        "Time is gold.",
                        "Be yourself, everyone else is taken."
                    ];
                    const randomIndex = Math.floor(Math.random() * quotes.length);
                    document.getElementById('randomQuote').textContent = '"' + quotes[randomIndex] + '"';
                    showToast('✨ VERNON SAYS: ' + quotes[randomIndex]);
                });
            }
        }

        switchTab(0);

        // ── JOYSTICK CONTROLS ──
        document.getElementById('leftBtn').addEventListener('click', () => switchTab(currentTab - 1));
        document.getElementById('rightBtn').addEventListener('click', () => switchTab(currentTab + 1));
        document.getElementById('selectBtn').addEventListener('click', () => {
            const rand = Math.floor(Math.random() * tabs.length);
            switchTab(rand);
            showToast('🎲 SELECTED: ' + tabs[rand].title);
        });
        document.getElementById('bigSelectBtn').addEventListener('click', () => {
            const rand = Math.floor(Math.random() * tabs.length);
            switchTab(rand);
            showToast('🎮 ARCADE SELECT: ' + tabs[rand].title);
        });

        // ── KEYBOARD SHORTCUTS ──
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') switchTab(currentTab - 1);
            if (e.key === 'ArrowRight') switchTab(currentTab + 1);
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                document.getElementById('selectBtn').click();
            }
        });

        // ── BACK TO TOP ──
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', function() {
            backToTopBtn.classList.toggle('visible', window.scrollY > 300);
        });
        backToTopBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ── TOAST ──
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ── PROFANITY FILTER & VALIDATION ──
        const BAD_WORDS = [
            'fuck', 'shit', 'ass', 'bitch', 'cunt', 'whore', 'slut', 'bastard',
            'idiot', 'stupid', 'hate', 'kill', 'die', 'racist', 'nazi', 'hitler',
            'suicide', 'selfharm', 'fag', 'retard', 'dyke', 'porn', 'sex', 'nude',
            'cock', 'dick', 'pussy', 'penis', 'vagina', 'asshole', 'damn', 'hell'
        ];

        function containsProfanity(text) {
            const lower = text.toLowerCase().trim();
            return BAD_WORDS.some(word => lower.includes(word));
        }

        function isKeyboardSpam(text) {
            const trimmed = text.trim();
            if (trimmed.length < 3) return false;
            const unique = new Set(trimmed.toLowerCase());
            if (unique.size <= 2) return true;
            const pattern = trimmed.match(/(.+)\1{2,}/);
            if (pattern && pattern[1].length >= 2) return true;
            if (/(.)\1{5,}/.test(trimmed)) return true;
            return false;
        }

        function containsHateSpeech(text) {
            const hateTerms = ['hate', 'kill', 'die', 'stupid', 'idiot', 'racist', 'nazi'];
            const lower = text.toLowerCase().trim();
            return hateTerms.some(term => lower.includes(term));
        }

        document.getElementById('msgForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('msgName');
            const msgInput = document.getElementById('msgContent');
            const name = nameInput.value.trim();
            const msg = msgInput.value.trim();

            if (!name || !msg) { showToast('⚠️ Please fill in both fields.'); return; }
            if (name.length > 20) { showToast('⚠️ Name must be under 20 characters.'); return; }
            if (msg.length > 200) { showToast('⚠️ Message must be under 200 characters.'); return; }
            if (containsProfanity(name) || containsProfanity(msg)) { showToast('⚠️ Please avoid using inappropriate language.'); return; }
            if (containsHateSpeech(name) || containsHateSpeech(msg)) { showToast('⚠️ Please keep messages respectful and kind.'); return; }
            if (isKeyboardSpam(msg)) { showToast('⚠️ Please write a meaningful message (no spam).'); return; }

            const list = document.getElementById('msgList');
            const div = document.createElement('div');
            div.className = 'msg-item';
            div.innerHTML = `<span class="sender">${escapeHtml(name)}</span> "${escapeHtml(msg)}"`;
            list.appendChild(div);
            nameInput.value = '';
            msgInput.value = '';
            showToast('💬 Message sent! ✦');
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('msgContent').addEventListener('input', function() {
            if (this.value.length > 200) this.value = this.value.slice(0, 200);
        });
    </script>
</body>
</html>
